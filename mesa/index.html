<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://generativelanguage.googleapis.com https://api.anthropic.com; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Mesa de Pensamento</title>
<meta name="description" content="Despeje o pensamento e veja virar mapa e cenários.">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: o mapa ocupa a tela; barra fina no topo, caixa de texto fixa embaixo, detalhes numa gaveta (lateral no PC). */
:root{
  --bg:#F7F7F5; --dot:#E1E0DC; --surface:#FFFFFF; --raise:#F1F1EF; --ink:#2F2E2B; --ink2:#787774; --line:#E6E5E1;
  --accent:#2383E2; --accent-bg:#E7F1FB; --accent-ink:#FFFFFF;
  --good:#448361; --bad:#D44C47; --eff:#8A8983; --ask:#9065B0; --ask-bg:#F1EBF7; --fav:#CB912F; --fav-bg:#FBF3DB;
  --edge:#CFCDC7; --shadow:0 1px 2px rgba(15,15,15,.06),0 3px 10px rgba(15,15,15,.05); --shadow2:0 8px 30px rgba(15,15,15,.14);
  --c0b:#E7F0F7; --c0f:#337EA9; --c1b:#FAEBDD; --c1f:#D9730D; --c2b:#E4F0EC; --c2f:#448361; --c3b:#EFE8F5; --c3f:#9065B0;
  --c4b:#F7E6EF; --c4f:#C14C8A; --c5b:#FBF3DB; --c5f:#B7852A; --c6b:#FBE4E4; --c6f:#D44C47; --c7b:#EFE7E2; --c7f:#9F6B53;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
  --comp-h:120px; --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --dot:#2B2B2B; --surface:#232323; --raise:#2C2C2C; --ink:#E6E5E3; --ink2:#9B9A97; --line:#353535;
    --accent:#529CCA; --accent-bg:#1E3246; --accent-ink:#0F1A24;
    --good:#4DAB9A; --bad:#FF7369; --eff:#9B9A97; --ask:#B38FE0; --ask-bg:#2E2440; --fav:#E0B04A; --fav-bg:#3A301A;
    --edge:#4A4A4A; --shadow:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.25); --shadow2:0 8px 30px rgba(0,0,0,.5);
    --c0b:#1F2E3B; --c0f:#5FA8D8; --c1b:#3A2716; --c1f:#E8883A; --c2b:#1D3029; --c2f:#5BB892; --c3b:#2D2239; --c3f:#B38FE0;
    --c4b:#38202D; --c4f:#E07BB0; --c5b:#37301A; --c5f:#E0B04A; --c6b:#3B2121; --c6f:#FF7369; --c7b:#33271F; --c7f:#C69173;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --dot:#2B2B2B; --surface:#232323; --raise:#2C2C2C; --ink:#E6E5E3; --ink2:#9B9A97; --line:#353535;
  --accent:#529CCA; --accent-bg:#1E3246; --accent-ink:#0F1A24;
  --good:#4DAB9A; --bad:#FF7369; --eff:#9B9A97; --ask:#B38FE0; --ask-bg:#2E2440; --fav:#E0B04A; --fav-bg:#3A301A;
  --edge:#4A4A4A; --shadow:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.25); --shadow2:0 8px 30px rgba(0,0,0,.5);
  --c0b:#1F2E3B; --c0f:#5FA8D8; --c1b:#3A2716; --c1f:#E8883A; --c2b:#1D3029; --c2f:#5BB892; --c3b:#2D2239; --c3f:#B38FE0;
  --c4b:#38202D; --c4f:#E07BB0; --c5b:#37301A; --c5f:#E0B04A; --c6b:#3B2121; --c6f:#FF7369; --c7b:#33271F; --c7f:#C69173;
  color-scheme:dark;
}
.h0{--tb:var(--c0b);--tf:var(--c0f)} .h1{--tb:var(--c1b);--tf:var(--c1f)} .h2{--tb:var(--c2b);--tf:var(--c2f)} .h3{--tb:var(--c3b);--tf:var(--c3f)}
.h4{--tb:var(--c4b);--tf:var(--c4f)} .h5{--tb:var(--c5b);--tf:var(--c5f)} .h6{--tb:var(--c6b);--tf:var(--c6f)} .h7{--tb:var(--c7b);--tf:var(--c7f)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

/* topo */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:58px;z-index:5}
.ib{width:42px;height:42px;border-radius:var(--r);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;color:var(--ink)}
.ib:hover:not(:disabled){background:var(--raise)}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;cursor:pointer;border-radius:var(--r);padding:6px 8px}
.ttl:hover{background:var(--raise)}
.ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;flex:none}
.seg button{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:7px;font-weight:600;font-size:.9rem;color:var(--ink2)}
.seg button svg.i{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.qbtn{height:42px;padding:0 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--ask);display:flex;align-items:center;gap:6px;flex:none}
.qbtn svg.i{width:18px;height:18px}
@media (max-width:560px){ .ttl{display:none} .top{justify-content:space-between} .seg button span{display:none} .seg button{padding:7px 12px} }

/* palco */
.stage{position:relative;flex:1;min-height:0}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.6}
#edges path.fio{stroke:var(--tf);opacity:.55}
#edges path.link{stroke:var(--tf);stroke-dasharray:5 6;stroke-width:2.2;opacity:.9}
#edges path.dim{opacity:.12}
@media (prefers-reduced-motion:reduce){#world.anim{transition:none}}

/* nós */
.nd{position:absolute;display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;user-select:none;-webkit-user-select:none;transition:opacity .18s,box-shadow .18s}
.nd b{font-weight:650;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;line-height:1.25;min-width:0}
.nd.dim{opacity:.2}
.nd.sel{box-shadow:0 0 0 2.5px var(--accent),var(--shadow)!important}
.tile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-bg);color:var(--accent)}
.tile svg.i{width:19px;height:19px}
.tema{background:var(--ink);color:var(--bg);font-size:1.08rem;border-radius:16px;padding:12px 14px}
.tema .tile{background:rgba(127,127,127,.22);color:var(--bg);width:38px;height:38px}
.tema b{font-weight:750;-webkit-line-clamp:3}
@media (max-width:699px){.tema{font-size:1rem;padding:10px 12px}}
.fio{background:var(--tb);border:1px solid color-mix(in srgb,var(--tf) 35%,transparent);font-size:.95rem;gap:9px;padding:9px 10px}
.fio .tile{background:var(--surface);color:var(--tf);width:30px;height:30px}
.fio .ct{margin-left:auto;font-weight:700;font-size:.8rem;color:var(--tf)}
.pt{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tf);border-radius:9px;font-size:.87rem;padding:6px 10px;color:var(--ink)}
.pt span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cen{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
.cen .r1{display:flex;align-items:center;gap:10px;min-width:0}
.cen .r1 b{font-size:.98rem}
.cen .r2{display:flex;align-items:center;gap:10px}
.cen.fav{border:2px solid var(--fav)}
.cen.fav .tile{background:var(--fav-bg);color:var(--fav)}
.cen.off{opacity:.42;border-style:dashed;box-shadow:none;background:transparent}
.cen.off.dim{opacity:.14}
.cen.nw{border-color:var(--accent)}
.badge{position:absolute;top:-9px;right:-7px;display:flex;gap:4px}
.badge i{font-style:normal;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--surface);border:1px solid var(--line);line-height:1.3;display:flex;align-items:center;gap:3px}
.badge i svg.i{width:11px;height:11px;stroke-width:2.4}
.badge .q{color:var(--ask)} .badge .s{color:var(--fav)} .badge .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .badge .ia{color:var(--accent)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--tf)}

/* medidores */
.mt{display:flex;gap:8px}
.mt span{display:flex;gap:2px}
.mt i{width:6px;height:10px;border-radius:2px;background:var(--line)}
.mt .g i.on{background:var(--good)} .mt .r i.on{background:var(--bad)} .mt .e i.on{background:var(--eff)}
.legend{position:absolute;left:12px;bottom:calc(var(--comp-h) + 10px);display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.76rem;font-weight:600;color:var(--ink2);pointer-events:none;z-index:2}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.zoom{position:absolute;right:12px;bottom:calc(var(--comp-h) + 10px);display:flex;flex-direction:column;gap:6px;z-index:2}

/* comparar */
#cmp{position:absolute;inset:0;bottom:var(--comp-h)}
#cmp svg.chart{width:100%;height:100%;display:block}
#cmp .ax{stroke:var(--line);stroke-width:1.5}
#cmp .ql{font:650 13px var(--f);fill:var(--ink2)}
#cmp .qi{stroke:var(--ink2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#cmp .al{font:600 12px var(--f);fill:var(--ink2)}
#cmp .bb{cursor:pointer}
#cmp .bb circle{fill:var(--surface);stroke:var(--edge);stroke-width:2}
#cmp .bb .ic{stroke:var(--accent);fill:none;stroke-linecap:round;stroke-linejoin:round}
#cmp .bb.fav circle{stroke:var(--fav);stroke-width:3;fill:var(--fav-bg)}
#cmp .bb.fav .ic{stroke:var(--fav)}
#cmp .bb.sel circle{stroke:var(--accent);stroke-width:3.5}
#cmp .bb text.l{font:650 12.5px var(--f);fill:var(--ink)}
#cmp .bb text.l.bg{stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.verdict{position:absolute;left:12px;right:12px;top:6px;z-index:3;display:flex;gap:10px;align-items:flex-start;background:var(--fav-bg);border:1px solid color-mix(in srgb,var(--fav) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:.92rem}
.verdict svg.i{color:var(--fav);margin-top:1px}
.verdict b{display:block;font-size:.78rem;color:var(--fav);font-weight:700;margin-bottom:2px}
@media (min-width:900px){.verdict{left:50%;transform:translateX(-50%);right:auto;width:560px}}

/* caixa de texto */
.comp{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.comp>*{pointer-events:auto}
@media (min-width:900px){.comp{left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 40px))} body.so .comp{left:calc((100% - 434px)/2);width:min(720px,calc(100% - 470px))}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.chip svg.i{width:16px;height:16px;color:var(--ink2)}
.chip:hover:not(:disabled){background:var(--raise)}
.chip.foc{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.foc svg.i{color:var(--bg)}
.chip.pend{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.chip.pend svg.i{color:var(--bad)}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow2);border-radius:16px;padding:6px 6px 6px 14px}
.box textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;padding:10px 0;max-height:34vh;line-height:1.4;font-size:1rem}
.box textarea::placeholder{color:var(--ink2)}
.send,.mic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.send{background:var(--accent);color:var(--accent-ink)}
.mic{color:var(--ink2)}
.mic.on{background:var(--bad);color:#fff}
.busy{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 7px 7px 14px;font-weight:600;font-size:.9rem}
.busy .bar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.busy .bar i{position:absolute;top:0;bottom:0;width:40%;background:var(--accent);border-radius:3px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.busy .bar i{animation:none;width:100%;left:0;opacity:.5}}
.busy button{display:flex;align-items:center;gap:6px;background:var(--raise);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.85rem}
.busy button svg.i{width:14px;height:14px}

/* gaveta */
#sheet{position:absolute;left:0;right:0;bottom:var(--comp-h);max-height:min(64vh,660px);z-index:7;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.16);display:flex;flex-direction:column}
#sheet .hd{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 10px}
#sheet .hd .tile{width:40px;height:40px;border-radius:10px}
#sheet .hd .tile svg.i{width:22px;height:22px}
#sheet .hd h2{margin:0;font-size:1.22rem;font-weight:750;line-height:1.25;flex:1;text-wrap:balance;padding-top:8px}
#sheet .hd .x{width:36px;height:36px;border-radius:9px;background:var(--raise);display:grid;place-items:center;flex:none}
#sheet .bd>*{flex-shrink:0}
#sheet .bd{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
@media (min-width:900px){
  #sheet{left:auto;right:12px;top:8px;bottom:12px;width:410px;max-height:none;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2)}
}
.frase{font-size:1.02rem;margin:0}
.lbl{font-size:.76rem;font-weight:700;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.meters{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.meters span{font-weight:600;font-size:.9rem}
.bar5{display:flex;gap:4px}
.bar5 button{flex:1;max-width:40px;height:14px;border-radius:4px;background:var(--line)}
.bar5 button:disabled{opacity:1;cursor:default}
.bar5.g button.on{background:var(--good)} .bar5.r button.on{background:var(--bad)} .bar5.e button.on{background:var(--eff)}
.tl{display:flex;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.st{flex:none;width:116px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative}
.st::before{content:"";position:absolute;top:34px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st .q{font-size:.76rem;font-weight:700;color:var(--accent);min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:108px}
.st .d{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;position:relative;z-index:1}
.st .o{font-size:.87rem;font-weight:550;padding:0 4px}
.cs{display:flex;flex-wrap:wrap;gap:6px}
.c{display:flex;align-items:center;gap:5px;border-radius:7px;padding:4px 9px;font-size:.87rem;font-weight:600;background:var(--raise)}
.c svg.i{width:14px;height:14px;stroke-width:2.4}
.c.good{color:var(--good)} .c.bad{color:var(--bad)} .c.if{color:var(--ink2)}
.conta{font-family:var(--mono);font-size:.9rem;background:var(--raise);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;margin-top:6px;font-family:var(--f)}
.chk.ok{color:var(--good)} .chk.no{color:var(--bad)}
.chk svg.i{width:15px;height:15px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 6px;border-radius:11px;background:var(--raise);font-weight:600;font-size:.8rem;color:var(--ink)}
.act svg.i{width:20px;height:20px}
.act.on{background:var(--fav-bg);color:var(--fav)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pts li{display:flex;gap:10px;align-items:flex-start;font-size:.98rem}
.pts li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--tf)}
.pts li span{flex:1}
.pts li button{color:var(--ink2);width:28px;height:28px;display:grid;place-items:center;border-radius:7px;margin-top:-4px}
.pts li button:hover{background:var(--raise)}
.pts li button svg.i{width:16px;height:16px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.lk{display:flex;flex-wrap:wrap;gap:6px}
.lk button{display:flex;gap:6px;align-items:center;background:var(--raise);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.88rem}
.lk button svg.i{width:16px;height:16px;color:var(--ink2)}
.ask{display:flex;flex-direction:column;gap:6px}
.ask button{text-align:left;display:flex;gap:10px;align-items:flex-start;background:var(--ask-bg);border-radius:10px;padding:10px 12px;font-weight:550}
.ask button svg.i{color:var(--ask);margin-top:1px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button,.menu label.mi{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:10px;font-weight:600;text-align:left;cursor:pointer}
.menu button:hover:not(:disabled),.menu label.mi:hover{background:var(--raise)}
.menu svg.i{color:var(--ink2)}
.menu .tile{width:30px;height:30px;border-radius:8px}
.menu .tile svg.i{width:17px;height:17px;color:inherit}
.menu small{margin-left:auto;color:var(--ink2);font-weight:500;font-size:.82rem;white-space:nowrap}
.menu .cur{background:var(--accent-bg)}
.menu .dng,.menu .dng svg.i{color:var(--bad)}
.fld{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=password],select,textarea.ta{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
textarea.ta{min-height:130px;font-family:var(--mono);font-size:.84rem;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:10px;font-weight:650;background:var(--raise)}
.btn svg.i{width:17px;height:17px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.87rem;color:var(--ink2);margin:0}
.note a{color:var(--accent);font-weight:650}
.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:8px}
.raw{background:var(--raise);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94rem}
.raw.p{outline:1.5px dashed var(--bad)}
.tiny{font-size:.78rem;font-weight:600;color:var(--ink2)}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;max-height:200px;overflow-y:auto;padding:2px}
.icogrid button{height:42px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.icogrid button:hover{background:var(--raise)}
.icogrid button.on{background:var(--accent-bg);color:var(--accent)}
.card{background:var(--raise);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}
.seg.pick{display:grid;grid-template-columns:1fr 1fr}
.seg.pick button{justify-content:center;padding:10px;font-size:.95rem}
.seg.pick button svg.i{width:17px;height:17px}
.seg.pick button span{display:inline!important}
.steps a{color:var(--accent);font-weight:650}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* avisos */
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--comp-h) + 12px);z-index:9;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:min(92vw,520px);box-shadow:var(--shadow2);text-align:center}
.banner{position:absolute;left:12px;right:12px;top:4px;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:7px 7px 7px 12px;font-weight:600;font-size:.9rem}
.banner span{display:flex;align-items:center;gap:8px}
.banner span svg.i{color:var(--accent)}
.banner .btn{padding:7px 11px}
@media (min-width:900px){.banner{left:50%;transform:translateX(-50%);right:auto;width:560px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ib" id="bMenu" type="button" aria-label="Menu" data-i="menu"></button>
    <div class="ttl" id="ttl" role="button" tabindex="0" aria-label="Abrir o tema"></div>
    <div class="seg" role="group" aria-label="Visão">
      <button type="button" id="vMapa" aria-pressed="true" aria-label="Mapa"><i data-i="network"></i><span>Mapa</span></button>
      <button type="button" id="vCmp" aria-pressed="false" aria-label="Comparar"><i data-i="chart-scatter"></i><span>Comparar</span></button>
    </div>
    <button class="qbtn" id="bAsk" type="button" aria-label="Dúvidas em aberto"><i data-i="circle-help"></i><span id="askN">0</span></button>
    <button class="ib" id="bUndo" type="button" aria-label="Desfazer" data-i="undo-2"></button>
  </header>

  <main class="stage" id="stage">
    <div id="vp" tabindex="-1"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
    <div id="cmp" hidden></div>
    <div class="banner" id="banner" hidden></div>
    <div class="legend" id="legend" aria-hidden="true"><span><i style="background:var(--good)"></i>ganho</span><span><i style="background:var(--bad)"></i>risco</span><span><i style="background:var(--eff)"></i>esforço</span></div>
    <div class="zoom" id="zoomBtns">
      <button class="ib" id="zSide" type="button" aria-label="Ir para os fios" data-i="panel-left"></button>
      <button class="ib" id="zIn" type="button" aria-label="Aproximar" data-i="plus"></button>
      <button class="ib" id="zOut" type="button" aria-label="Afastar" data-i="minus"></button>
      <button class="ib" id="zFit" type="button" aria-label="Ver tudo" data-i="maximize"></button>
    </div>
    <section id="sheet" hidden aria-live="polite"></section>
    <div id="toast" hidden role="status"></div>

    <div class="comp" id="comp">
      <div class="chips" id="chips"></div>
      <div class="busy" id="busy" hidden><span id="busyT">Pensando…</span><span class="bar"><i></i></span><button type="button" id="bStop"><i data-i="square"></i>Parar</button></div>
      <div class="box">
        <label for="inp" class="sr">Escreva aqui</label>
        <textarea id="inp" rows="1" placeholder="Joga tudo aqui, do jeito que vier…"></textarea>
        <button class="mic" id="bMic" type="button" aria-label="Ditar" data-i="mic" hidden></button>
        <button class="send" id="bSend" type="button" aria-label="Mandar" data-i="arrow-up"></button>
      </div>
    </div>
  </main>
</div>
<input type="file" id="fileIn" accept=".json,.md,.txt,application/json,text/markdown,text/plain" hidden>

var SZ_D={temaW:236,temaH:76,fioW:200,fioH:54,ptW:204,ptH:46,cenW:228,cenH:88,g:12,bg:24,gapX:84,colX:64};
var SZ_M={temaW:168,temaH:92,fioW:180,fioH:54,ptW:184,ptH:48,cenW:196,cenH:88,g:12,bg:22,gapX:44,colX:44};

function layout(){
  SZ=isPhone()?SZ_M:SZ_D;
  var m=S.cur, N=[], E=[];
  var T={id:'__tema',t:'tema',x:-SZ.temaW/2,y:-SZ.temaH/2,w:SZ.temaW,h:SZ.temaH};
  N.push(T);
  var blocks=m.fios.map(function(f,i){var n=f.pontos.length;var lh=n?n*(SZ.ptH+SZ.g)-SZ.g:0;return {f:f,i:i,n:n,lh:lh,hh:Math.max(SZ.fioH,lh)};});
  var tot=blocks.reduce(function(a,b){return a+b.hh;},0)+SZ.bg*Math.max(0,blocks.length-1);
  var y=-tot/2, fx=T.x-SZ.gapX-SZ.fioW;
  blocks.forEach(function(b){
    var cy=y+b.hh/2, hue=b.i%8;
    var F={id:b.f.id,t:'fio',x:fx,y:cy-SZ.fioH/2,w:SZ.fioW,h:SZ.fioH,it:b.f,hue:hue};
    N.push(F); E.push({a:T,b:F,side:'L',cls:'fio',hue:hue,ids:[T.id,F.id]});
    var ly=cy-b.lh/2;
    b.f.pontos.forEach(function(p,j){
      var P={id:b.f.id+'#'+j,t:'pt',x:fx-SZ.colX-SZ.ptW,y:ly+j*(SZ.ptH+SZ.g),w:SZ.ptW,h:SZ.ptH,it:{texto:p,fio:b.f.id},hue:hue};
      N.push(P); E.push({a:F,b:P,side:'L',cls:'fio',hue:hue,ids:[F.id,P.id]});
    });
    y+=b.hh+SZ.bg;
  });
  var byId={}; m.cenarios.forEach(function(c){byId[c.id]=c;});
  function isRoot(c){ if(!c.pai||!byId[c.pai]) return true; var seen={},p=c; while(p&&p.pai&&byId[p.pai]){ if(seen[p.id]) return true; seen[p.id]=1; p=byId[p.pai]; if(p===c) return true; } return false; }
  var rank={favorito:0,ativo:1,descartado:2};
  function sortC(list){return list.slice().sort(function(a,b){return (rank[a.status]||1)-(rank[b.status]||1);});}
  var kids={}; m.cenarios.forEach(function(c){ if(!isRoot(c)){ (kids[c.pai]=kids[c.pai]||[]).push(c);} });
  var roots=sortC(m.cenarios.filter(isRoot));
  var memo={};
  function hgt(c,d){ if(d>8) return SZ.cenH; if(memo[c.id]) return memo[c.id]; var ks=sortC(kids[c.id]||[]); var s=ks.reduce(function(a,k){return a+hgt(k,d+1);},0)+SZ.g*Math.max(0,ks.length-1); return memo[c.id]=Math.max(SZ.cenH,s); }
  var rt=roots.reduce(function(a,c){return a+hgt(c,0);},0)+SZ.bg*Math.max(0,roots.length-1);
  var ry=-rt/2, x0=T.x+T.w+SZ.gapX;
  function place(c,parentNode,d,top){
    var hh=hgt(c,d), cy=top+hh/2;
    var C={id:c.id,t:'cen',x:x0+d*(SZ.cenW+SZ.colX),y:cy-SZ.cenH/2,w:SZ.cenW,h:SZ.cenH,it:c};
    N.push(C); E.push({a:parentNode,b:C,side:'R',cls:'',ids:[parentNode.id,C.id]});
    var ks=sortC(kids[c.id]||[]); if(d>8) return;
    var ksum=ks.reduce(function(a,k){return a+hgt(k,d+1);},0)+SZ.g*Math.max(0,ks.length-1);
    var ky=cy-ksum/2;
    ks.forEach(function(k){ place(k,C,d+1,ky); ky+=hgt(k,d+1)+SZ.g; });
  }
  roots.forEach(function(c){ place(c,T,0,ry); ry+=hgt(c,0)+SZ.bg; });

}
function edgePath(a,b,side){
  var x1,y1,x2,y2;
  if(side==='L'){ x1=a.x; y1=a.y+a.h/2; x2=b.x+b.w; y2=b.y+b.h/2; }
  else { x1=a.x+a.w; y1=a.y+a.h/2; x2=b.x; y2=b.y+b.h/2; }
  var mx=(x1+x2)/2;
  return 'M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2;
}

  if(f.t==='cen'){ var c=f.it; c.usa.forEach(function(u){set[u]=1;});
    var p=c, guard=0; while(p&&p.pai&&guard++<10){ set[p.pai]=1; var q=null; m.cenarios.forEach(function(x){if(x.id===p.pai)q=x;}); p=q; }

}

function bounds(filter){ var b={x1:Infinity,y1:Infinity,x2:-Infinity,y2:-Infinity}; Object.keys(S.nodes).forEach(function(k){var n=S.nodes[k]; if(filter&&!filter(n)) return; b.x1=Math.min(b.x1,n.x);b.y1=Math.min(b.y1,n.y);b.x2=Math.max(b.x2,n.x+n.w);b.y2=Math.max(b.y2,n.y+n.h);}); return b; }

function toMd(mesa){
  var m=mesa||S.cur, by={}; m.fios.concat(m.cenarios).forEach(function(x){by[x.id]=x;});

  if(m.tema.veredito) L.push('> [!tip] Recomendação','> '+m.tema.veredito,'');
  L.push('## Fios','');
  m.fios.forEach(function(f){L.push('### '+f.nome); f.pontos.forEach(function(p){L.push('- '+p);}); L.push('');});
  L.push('## Cenários','');
  m.cenarios.forEach(function(c){
    L.push('### '+c.nome+(c.status==='favorito'?' ★':'')+(c.status==='descartado'?' (descartado)':''));
    if(c.pai&&by[c.pai]) L.push('↳ variação de '+by[c.pai].nome);
    if(c.frase) L.push(c.frase);
    L.push('Ganho '+c.ganho+'/5 · Risco '+c.risco+'/5 · Esforço '+c.esforco+'/5');

(function(){
  var vp=$('#vp'), ptrs=new Map(), drag=null, pinch=null, downEl=null, moved=false;
  function d2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  vp.addEventListener('pointerdown',function(e){
    if(e.button>0) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y}; moved=false; downEl=e.target.closest?e.target.closest('.nd'):null; }
    else if(ptrs.size===2){ var v=Array.from(ptrs.values()); var r=vp.getBoundingClientRect();
      pinch={d:d2(v[0],v[1]),k:S.cam.k,wx:(((v[0].x+v[1].x)/2-r.left)-S.cam.x)/S.cam.k,wy:(((v[0].y+v[1].y)/2-r.top)-S.cam.y)/S.cam.k}; moved=true; }
  });
  vp.addEventListener('pointermove',function(e){
    if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptrs.size>=2){ var v=Array.from(ptrs.values()), r=vp.getBoundingClientRect();
      var k=clamp(pinch.k*d2(v[0],v[1])/pinch.d,0.2,2.4), mx=(v[0].x+v[1].x)/2-r.left, my=(v[0].y+v[1].y)/2-r.top;
      S.cam.k=k; S.cam.x=mx-pinch.wx*k; S.cam.y=my-pinch.wy*k; applyCam(); }
    else if(drag){ var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(!moved&&Math.hypot(dx,dy)>6){ moved=true; vp.classList.add('drag'); try{vp.setPointerCapture(e.pointerId);}catch(er){} }
      if(moved){ S.cam.x=drag.cx+dx; S.cam.y=drag.cy+dy; applyCam(); } }
  });
  function up(e){
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size===0){ vp.classList.remove('drag');
      if(!moved&&e.type==='pointerup'){ if(downEl) selectItem(downEl.dataset.id); else if(S.sel||!$('#sheet').hidden) selectItem(null); }
      drag=null; pinch=null; downEl=null; }
    else if(ptrs.size===1){ pinch=null; var p=Array.from(ptrs.values())[0]; drag={x:p.x,y:p.y,cx:S.cam.x,cy:S.cam.y}; }
  }
  vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',up);
  vp.addEventListener('wheel',function(e){ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)),e.clientX,e.clientY); },{passive:false});
  vp.addEventListener('keydown',function(e){ var el=e.target.closest&&e.target.closest('.nd'); if(el&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); selectItem(el.dataset.id); } });
